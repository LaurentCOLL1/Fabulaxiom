# TEMPORARY CI-only lockfile generation. This workflow is deleted before PR review.
# No changes to repository or operator files. Not a production workflow.
name: M3.2 temporary Vite 8.1.7 lock bootstrap
on:
  push:
    branches:
      - m32-security-vite-8-1-7-20261110
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout disposable branch
        uses: actions/checkout@v7
      - name: Setup Node 24 for npm lock generation
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Generate authoritative npm lock without running package scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact --save-dev vite@8.1.7
          node <<'NODE'
          const fs = require("node:fs");
          const text = fs.readFileSync("package-lock.json", "utf8");
          const lock = JSON.parse(text);
          const root = lock.packages[""].devDependencies.vite;
          const vite = lock.packages["node_modules/vite"]?.version;
          const rolldown = lock.packages["node_modules/rolldown"]?.version;
          const [major, minor, patch] = (rolldown || "").split(".").map(Number);
          if (root !== "8.1.7" || vite !== "8.1.7" ||
              major !== 1 || minor !== 1 || !(patch >= 7)) {
            throw new Error("STOP: corrected Vite and Rolldown not resolved together");
          }
          console.log("M32_VITE_LOCK_VERSIONS:" + JSON.stringify({ root, vite, rolldown, bytes: text.length }));
          console.log("M32_LOCKFILE_BEGIN");
          for (let i = 0; i < text.length; i += 512) {
            console.log("M32_LOCK_CHUNK:" + JSON.stringify(text.slice(i, i + 512)));
          }
          console.log("M32_LOCKFILE_END");
          NODE
