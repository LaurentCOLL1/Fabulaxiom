name: M0 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Windows frontend and Rust checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Frontend tests
        run: npm run test:ci

      - name: Frontend production build
        run: npm run build

      - name: Rust tests from lockfile
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Rust check from lockfile
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Verify dependency locks are unchanged
        shell: pwsh
        run: |
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) {
            throw "Dependency lockfiles changed during deterministic CI."
          }
