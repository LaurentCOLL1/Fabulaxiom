name: M0 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Windows frontend and Rust checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend tests
        run: npm run test:ci

      - name: Frontend production build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Preserve generated dependency locks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: m0-dependency-locks
          path: |
            package-lock.json
            src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 7
