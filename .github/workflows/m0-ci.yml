name: Fabulaxiom CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Windows frontend and Rust checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Frontend tests
        run: npm run test:ci

      - name: Frontend production build
        run: npm run build

      - name: Setup Python for isolated audit fixtures
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read-only pre-v7 audit fixture tests
        run: python -m unittest discover -s tools -p "test_m3_1_v6_audit.py" -v

      - name: Isolated pre-v7 backup and restore fixture tests
        run: python -m unittest discover -s tools -p "test_m3_1_v6_backup.py" -v

      - name: Copy-only candidate-v7 rehearsal synthetic fixtures
        run: python -m unittest discover -s tools -p "test_m3_1_v7_copy_rehearsal.py" -v

      - name: Fourth-copy forced rollback synthetic fixtures
        run: python -m unittest discover -s tools -p "test_m3_1_v7_rollback_rehearsal.py" -v

      - name: Real candidate-v7 read-only and RAM constraint fixtures
        run: python -m unittest discover -s tools -p "test_m3_1_v7_final_readonly.py" -v

      - name: M3.1 isolated Tauri identity and v7 copy preparation fixtures
        run: python -m unittest discover -s tools -p "test_m3_1_v7_isolated_launch_prepare.py" -v

      - name: M3.1 actual Windows token API smoke check (no staging)
        run: |
          python -c "import sys; sys.path.insert(0, 'tools'); import m3_1_v7_isolated_launch_prepare as m; value = m._windows_admin_token_enabled(); assert isinstance(value, bool); print('WINDOWS_TOKEN_API: PASS; elevated=' + str(value))"

      - name: M3.2 post-restart read-only gate synthetic Windows tests
        run: python -m unittest discover -s tools -p "test_m3_2_operator_readonly_gate.py" -v

      - name: M3.2 multi-root custody read-only synthetic Windows tests
        run: python -m unittest discover -s tools -p "test_m3_2_multiroot_readonly.py" -v

      - name: M3.2 pinned historical authority negative Windows tests
        run: python -m unittest discover -s tools -p "test_m3_2_independent_authority_gate.py" -v

      - name: M3.2 M3.1 archived manifests semantic Windows fixtures
        run: python -m unittest discover -s tools -p "test_m3_2_m31_semantic_readonly.py" -v

      - name: M3.2 manifest-free source-pinned read-only custody Windows tests
        run: python -m unittest discover -s tools -p "test_m3_2_direct_custody_readonly.py" -v

      - name: M3.2 isolated V7 physical read-only synthetic Windows fixtures
        run: python -m unittest discover -s tools -p "test_m3_2_isolated_v7_physical_readonly.py" -v

      - name: M3.2 external provenance claims triage synthetic Windows fixtures
        run: python -m unittest discover -s tools -p "test_m3_2_provenance_triage.py" -v

      - name: M3.2 append-only supersession reference synthetic Windows tests
        run: python -m unittest discover -s tools -p "test_m3_2_supersession_reference.py" -v

      - name: M3.2 readonly world chronology projection synthetic Windows tests
        run: python -m unittest discover -s tools -p "test_m3_2_chronology_projection_reference.py" -v

      - name: M3.2 readonly chronology presentation synthetic Windows tests
        run: python -m unittest discover -s tools -p "test_m3_2_chronology_presentation_reference.py" -v

      - name: M3.2 readonly chronology pagination synthetic Windows tests
        run: python -m unittest discover -s tools -p "test_m3_2_chronology_pagination_reference.py" -v

      - name: M3.2 readonly chronology navigation filters synthetic Windows tests
        run: python -m unittest discover -s tools -p "test_m3_2_chronology_navigation_reference.py" -v

      - name: M3.2 explicit filtered chronology comparison synthetic Windows tests
        run: python -m unittest discover -s tools -p "test_m3_2_chronology_comparison_reference.py" -v

      - name: M3.2 explicit world chronology witness synthetic Windows tests
        run: python -m unittest discover -s tools -p "test_m3_2_chronology_witness_reference.py" -v

      - name: Rust tests from lockfile
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Rust check from lockfile
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: M3.1 isolated read-only Tauri preview Rust unit tests
        working-directory: src-tauri
        run: cargo test --locked --features m31-isolated-preview --lib m31_readonly_preview

      - name: M3.2 isolated preflight-only Tauri feature and identity tests
        working-directory: src-tauri
        run: cargo test --locked --features m32-isolated-preflight --lib m32_isolated_preflight

      - name: Verify dependency locks are unchanged
        shell: pwsh
        run: |
          git --no-pager diff --exit-code -- package-lock.json src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) {
            throw "Dependency lockfiles changed during deterministic CI."
          }
