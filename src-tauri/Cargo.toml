[package]
name = "fabulaxiom"
version = "0.1.0"
description = "Local-first narrative memory application"
authors = ["LaurentCOLL1"]
edition = "2024"

[lib]
name = "fabulaxiom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Never enabled in production/default builds. Requires a unique operator identity.
[features]
default = []
m31-isolated-preview = []
# Debug-only preflight: ZERO write IPC; a future writer needs new authorization.
m32-isolated-preflight = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
